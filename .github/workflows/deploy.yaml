name: Vue.js Build and Deploy (Local Runner)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Vue.js
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build do Vue
        run: npm run build

      - name: Verificar dist
        run: ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vue-dist
          path: dist

  deploy:
    name: Deploy no Local Runner
    runs-on: self-hosted
    needs: build

    steps:
      - name: Preparar diretório
        run: |
          mkdir -p "${{ vars.PATH }}"
          rm -rf "${{ vars.PATH }}/*"

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: vue-dist
          path: ${{ vars.PATH }}

      - name: Verificar deploy
        run: ls -la "${{ vars.PATH }}"
