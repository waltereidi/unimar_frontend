name: Vue.js Build and Deploy (Local Runner)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build Vite
        run: npm run build

      - name: Descobrir pasta de saída
        id: outdir
        run: |
          if [ -d dist ]; then
            echo "dir=dist" >> $GITHUB_OUTPUT
          elif [ -d build ]; then
            echo "dir=build" >> $GITHUB_OUTPUT
          elif [ -d .output/public ]; then
            echo "dir=.output/public" >> $GITHUB_OUTPUT
          else
            echo "❌ Nenhuma pasta de build encontrada"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vue-dist
          path: ${{ steps.outdir.outputs.dir }}

  deploy:
    runs-on: self-hosted
    needs: build

    steps:
      - name: Preparar diretório
        run: |
          mkdir -p "${{ vars.PATH }}"
          rm -rf "${{ vars.PATH }}/*"

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: vue-dist
          path: ${{ vars.PATH }}

      - name: Verificar deploy
        run: ls -la "${{ vars.PATH }}"
